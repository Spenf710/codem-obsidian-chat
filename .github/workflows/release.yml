name: Release

on:
  push:
    tags:
      - '*'

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build
        run: |
          npm ci
          npm run build

      - name: Ensure release exists
        run: gh release create "${{ github.ref_name }}" --verify-tag --title "${{ github.ref_name }}" --notes "Release ${{ github.ref_name }}" || true
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            styles.css

      - name: Upload release assets
        run: gh release upload "${{ github.ref_name }}" main.js manifest.json styles.css --clobber
        env:
          GH_TOKEN: ${{ github.token }}
